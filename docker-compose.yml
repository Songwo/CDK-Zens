services:
  miukey:
    build:
      context: .
      args:
        VITE_HCAPTCHA_SITE_KEY: ${VITE_HCAPTCHA_SITE_KEY:-10000000-ffff-ffff-ffff-000000000001}
    ports:
      - "8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CDK_AIRDROP_REDIS_URL=redis://redis:6379/0
      - CDK_AIRDROP_RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - CDK_AIRDROP_DATA_FILE=/app/data/state.json
      - CDK_MYSQL_DSN=${CDK_MYSQL_DSN:-}
      - HCAPTCHA_SECRET=${HCAPTCHA_SECRET:-}
      - HCAPTCHA_SITE_KEY=${HCAPTCHA_SITE_KEY:-}
      - HCAPTCHA_VERIFY_URL=${HCAPTCHA_VERIFY_URL:-https://api.hcaptcha.com/siteverify}
      - CDK_COMMUNITY_URL=${CDK_COMMUNITY_URL:-http://localhost:5173}
      - CDK_COMMUNITY_CLIENT_ID=${CDK_COMMUNITY_CLIENT_ID:-cdk-airdrop}
      - CDK_COMMUNITY_JWT_SECRET=${CDK_COMMUNITY_JWT_SECRET:-zf3sg4ikVorzR1S/cel4+o/VkQH+4LZxU8RkX0c0Ne6BFPf9NnPL09AoHSK9Zg95}
    volumes:
      - ./server/data:/app/data
    depends_on:
      - redis
      - rabbitmq

  redis:
    image: redis:7-alpine

  rabbitmq:
    image: rabbitmq:3-management-alpine
